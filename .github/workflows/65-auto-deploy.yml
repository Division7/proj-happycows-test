name: Deploy via SSH

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Install opkssh
      run: curl -sSLf https://raw.githubusercontent.com/openpubkey/opkssh/main/scripts/install-linux.sh | sudo bash

    - name: Login
      run: opkssh login github

    - name: SSH into server
      env:
        HOST_URL: ${{ secrets.HOST_URL }}
      run: |
        ssh -o StrictHostKeyChecking=accept-new "actions@$HOST_URL" "dokku git:sync happycows https://github.com/$GITHUB_REPOSITORY  $GITHUB_HEAD_REF --build"
