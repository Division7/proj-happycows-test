name: Deploy via SSH

on:
  pull_request:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Install opkssh
      run: curl -sSLf https://raw.githubusercontent.com/openpubkey/opkssh/main/scripts/install-linux.sh | bash

    - name: Login
      run: opkssh login github

    - name: SSH into server
      with:
        HOST_URL: ${{ secrets.HOST_URL }}
      env:
        REPO: ${{ github.GITHUB_REPOSITORY }}
        REF: ${{ github.REF }}
      run: |
        ssh -o StrictHostKeyChecking=accept-new "actions@$HOST_URL" "dokku git:sync happycows https://github.com/$REPO  $REF --build"
